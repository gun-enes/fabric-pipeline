name: Manage Synapse Triggers (synw-spf-0091-dev-mgmt Workspace)

on:
  workflow_dispatch:
    inputs:
      trigger_names:
        description: 'Comma-separated list of Synapse Triggers'
        required: true
        type: string
      operation_mode:
        description: 'Choose action'
        required: true
        type: choice
        default: 'stop'
        options:
          - start
          - stop
          - remove

permissions:
  contents: read

jobs:
  manage-synapse-triggers:
    name: "Manage Synapse Triggers"
    runs-on: [adp]
    environment: db_dev

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure Login
        id: azure_login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        env:
          SUBSCRIPTION_ID: spfdev-gdd9k-p-rCw7stO8Bw0
        with:
          creds: '{"clientId":"${{ secrets.CLIENT_ID }}","clientSecret":"${{ secrets.CLIENT_SECRET }}","tenantId":"${{ secrets.TENANT_ID }}","subscriptionId":"${{ env.SUBSCRIPTION_ID }}"}'
          enable-AzPSSession: true

      - name: Execute Trigger Action
        shell: pwsh
        working-directory: code/scripts
        env:
          INPUT_NAMES: ${{ github.event.inputs.trigger_names }}
          INPUT_MODE:  ${{ github.event.inputs.operation_mode }}
          SYNAPSE_WORKSPACE: synw-spf-0091-dev-mgmt
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          # Setup Mode and List
          $mode = $Env:INPUT_MODE
          if (-not [string]::IsNullOrWhiteSpace($Env:INPUT_NAMES)) {
              $targetTriggers = $Env:INPUT_NAMES -split "," | ForEach-Object { $_.Trim() }
          } else {
              Write-Error "No triggers found to process."
              exit 1
          }

          # Determine Script Action
          $scriptAction = if ($mode -eq "start") { "start" } else { "stop" }

          Write-Host "Mode: $mode | Script Action: $scriptAction | Count: $($targetTriggers.Count)"

          # Execution Loop
          $missingTriggers = @()
          foreach ($trigger in $targetTriggers) {
              Write-Host "Processing: $trigger"

              # Check trigger existence
              try {
                  Get-AzSynapseTrigger `
                      -WorkspaceName $Env:SYNAPSE_WORKSPACE `
                      -Name $trigger `
                      -ErrorAction Stop | Out-Null

                  Write-Host "Trigger exists: $trigger"
              }
              catch {
                  Write-Warning "Trigger not found: $trigger"
                  $missingTriggers += $trigger
                  continue
              }

              # Start / Stop
              try {
                  $result = & "./SynapseStartStopTriggers.ps1" `
                      -SynapseTriggerName $trigger `
                      -SynapseWorkspaceName $Env:SYNAPSE_WORKSPACE `
                      -Action $scriptAction

                  Write-Host "Result: $result"
              }
              catch {
                  Write-Error "Start/Stop failed for ${trigger}: $_"
                  exit 1
              }

              # Remove
              if ($mode -eq "remove") {
                  Start-Sleep -Seconds 2
                  try {
                      Write-Host "Removing trigger..."
                      Remove-AzSynapseTrigger `
                          -WorkspaceName $Env:SYNAPSE_WORKSPACE `
                          -Name $trigger `
                          -Force `
                          -ErrorAction Stop

                      Write-Host "Removed: $trigger"
                  }
                  catch {
                      Write-Error "Removal failed for ${trigger}: $_"
                      exit 1
                  }
              }
          }

          # Print not found triggers
          if ($missingTriggers.Count -gt 0) {
              Write-Error "The following triggers were not found in workspace '$($Env:SYNAPSE_WORKSPACE)': $($missingTriggers -join ', ')"
              exit 1
          }
