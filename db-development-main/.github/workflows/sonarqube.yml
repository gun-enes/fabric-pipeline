name: SonarQube Scan
on:
  schedule:
    - cron: '0 4 1 * *'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on:
    - self-hosted
    - linux
    - adp
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: ADP-Allianz-Data-Platform/scanner-actions/.github/actions/sonarqube-scan@32f10601feb0a6e6b4ac2dc3add569e5b16e7cc6 # v1.0.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_PROD }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL_PROD }}
