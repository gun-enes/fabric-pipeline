name: Decommission Extension Components
on:
  workflow_dispatch:
    inputs:
      workspaceName:
        description: 'Synapse Workspace Name'
        required: true
        type: string
      sqlPoolName:
        description: 'Dedicated SQL Pool Name'
        required: true
        type: string
      subscriptionId:
        description: 'Subscription Id'
        required: true
        type: string
      environment:
        description: '(Github) Environment Name (i.e. simplifi-dev or agcs-dev)'
        required: true
        type: string
      extensionName:
        description: 'Extension Name for decommission (i.e. ext01 or ext02 but Please provide extension name with extra cautious)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  ext-decom-process:
    name: Azure Login
    runs-on: [adp]
    environment: ${{ inputs.environment }}
    steps:
    # Checkout repository
      - name: Check Out Repository
        id: checkout_repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure Login
        id: azure_login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          creds: '{"clientId":"${{ secrets.CLIENT_ID }}","clientSecret":"${{ secrets.CLIENT_SECRET }}","tenantId":"${{ secrets.TENANT_ID }}","subscriptionId":"${{ inputs.subscriptionId}}"}'
          enable-AzPSSession: true

      - name: Checking the SQL Pool status ${{ needs.rename-original-pool.outputs.currentPoolRestored }}
        id: pause_swapout_pool
        env:
          workspace_name: ${{ inputs.workspaceName }}
          sql_pool_name: ${{ inputs.sqlPoolName }}
          subscription_id: ${{ inputs.subscriptionId }}
        run: |
          az account set -s "$env:subscription_id"
          $SQL_STAT=$(Get-AzSynapseSqlPool –WorkspaceName $env:workspace_name –Name $env:sql_pool_name)
          if($SQL_STAT.Status -eq "Paused")
          {
            Write-Host "Resuming the pool $($env:SQLPool_NAME)..."
            $RESUME_POOL=$(Resume-AzSynapseSqlPool –WorkspaceName $env:workspace_name –Name $env:sql_pool_name)
            Write-Host "Current status of the Pool $($env:sql_pool_name): $($SQL_STAT.Status)"
          }
          else
          {
            Write-Host "The pool $($env:SQLPool_NAME) is not paused. Current status: $($SQL_STAT.Status)"
          }
        shell: pwsh

      # Generate Azure Active Directory Token
      - name: Generate Azure Active Directory Token
        id: azure_access_token
        run: |
          echo "Set Azure Context"
          az account set -s "${{ inputs.subscriptionId }}"
          echo "Create Azure Access Token"
          ACCESS_TOKEN=$(az account get-access-token --scope "https://database.windows.net/.default" --query "accessToken" -o tsv)
          echo "::add-mask::${ACCESS_TOKEN}"
          echo "Set secret value"
          echo "azureAccessToken=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      # Decommission Process begins
#      - name: Extension Decommission for ${{ inputs.sqlPoolName }}
#       id: ext_decom_proc
#        env:
#          ext_name: ${{ inputs.extensionName }}
#        run: |
#          Invoke-Sqlcmd `
#            -ServerInstance "${{ inputs.workspaceName }}.sql.azuresynapse.net" `
#            -Database "${{ inputs.sqlPoolName}}" `
#            -AccessToken ${{ steps.azure_access_token.outputs.azureAccessToken }} `
#            -Query "EXEC [mgmt_xtinfra].[sp_infra_ext_decom] @ops_type='decom',@ext_name=$($env:ext_name);"
#          Write-Host "Decommission activity for $($env:ext_name) in ${{ inputs.sqlPoolName }} has been finished"
#       shell: pwsh

      # Validating the decommission process completion
      - name: Validating Decommission process for ${{ inputs.extensionName }} in  ${{ inputs.sqlPoolName }}
        id: validate_decom_process
        env:
          ext_name: ${{ inputs.extensionName }}
          workspace_name: ${{ inputs.workspaceName }}
          sql_pool_name: ${{ inputs.sqlPoolName }}
          access_token: ${{ steps.azure_access_token.outputs.azureAccessToken }}
        run: |
          if ($env:ext_name -notmatch '^(tdp_ext|ext)\d{2,3}$') {
            Write-Error "Invalid extensionName format"
            exit 1
          }
          Invoke-Sqlcmd `
            -ServerInstance "$($env:workspace_name).sql.azuresynapse.net" `
            -Database "$($env:sql_pool_name)" `
            -AccessToken $env:access_token `
            -Query "EXEC [mgmt_xtinfra].[sp_infra_ext_decom] @ops_type='validate',@ext_name='\$(ext_name)';" `
            -Variable "ext_name=$($env:ext_name)"
          $procedureResult = Invoke-Sqlcmd `
            -ServerInstance "$($env:workspace_name).sql.azuresynapse.net" `
            -Database "$($env:sql_pool_name)" `
            -AccessToken $env:access_token `
            -Query "SELECT * FROM mgmt_xtinfra.infra_ext_decom_log ORDER BY LogID;"
          $output = "Extension Removal Validation`n------------------------`n"
          if ($procedureResult) {
            $procedureResult | ForEach-Object {
              $output += "LogID: $($_.LogID), ObjectType: $($_.ObjectType), ExistingObjectCount: $($_.ExistingObjectCount), ExpectedObjectCount: $($_.ExpectedObjectCount), Timestamp: $($_.Timestamp)`n"
            }
          } else {
            $output += "No log entries found."
          }
          Write-Host "Procedure Output:"
          Write-Host $output
          echo "::set-output name=operation_log::$output"
          Write-Host "Decommission validation for $($env:ext_name) in $($env:sql_pool_name) has been finished"
        shell: pwsh
      # Log out from Azure
      - name: Log out from Azure
        id: azure_logout
        run: |
          az logout
