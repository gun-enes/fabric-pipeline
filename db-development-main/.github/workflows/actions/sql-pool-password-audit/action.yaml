name: 'SQL Pool Password Audit'
description: 'Query master for local logins, upsert into pool audit table, disable overdue logins, and send grace period notifications'

inputs:
  target_environment:
    required: true
    type: string
  terraform_outputs:
    required: true
    type: string
  config_dir:
    required: true
    type: string
    description: "Absolute path to the tdp-infra-config directory (used to read alerting emails)"
  arm_client_id:
    required: true
  arm_client_secret:
    required: true
  arm_tenant_id:
    required: true
  smtp_password:
    required: true

runs:
  using: "composite"
  steps:

    - name: Check SQL authentication is enabled for mgmt workspace
      id: check_sql_auth
      shell: bash
      env:
        OE_NAME:         ${{ fromJSON(inputs.target_environment).oe_name }}
        INFRA_APP_NAME:  ${{ fromJSON(inputs.target_environment).infra_app_name }}
        STAGE:           ${{ fromJSON(inputs.target_environment).stage }}
        CONFIG_DIR:      ${{ inputs.config_dir }}
      run: |
        set -euo pipefail
        env_dir="${CONFIG_DIR}/config/${OE_NAME}/${INFRA_APP_NAME}/${STAGE}"
        vars_file="${env_dir}/vars.tfvars"

        if [ ! -f "$vars_file" ]; then
          echo "::error::vars.tfvars not found at ${vars_file}"
          exit 1
        fi

        # Read azuread_authentication_only_mgmt from HCL, skipping commented-out lines
        # and stripping any trailing inline comment (# or //). Last assignment wins.
        azuread_only=$(awk '
          /^[[:space:]]*azuread_authentication_only_mgmt[[:space:]]*=/ {
            v = $0
            sub(/^[^=]*=[[:space:]]*/, "", v)
            sub(/#.*/, "", v)
            sub(/\/\/.*/, "", v)
            gsub(/[[:space:]]/, "", v)
            last = v
          }
          END { print last }
        ' "$vars_file")

        # The terraform variable defaults to true, so an absent key means Entra-only auth.
        if [ -z "$azuread_only" ]; then
          azuread_only=true
          echo "azuread_authentication_only_mgmt not set in ${vars_file}; using terraform default (true)."
        fi

        if [ "$azuread_only" != "true" ] && [ "$azuread_only" != "false" ]; then
          echo "::error::azuread_authentication_only_mgmt in ${vars_file} must be true or false, got '${azuread_only}'"
          exit 1
        fi

        if [ "$azuread_only" = "true" ]; then
          echo "azuread_authentication_only_mgmt = true — the mgmt workspace accepts Entra authentication only,"
          echo "so there are no local SQL logins to audit. Skipping the SQL pool password audit."
          echo "run_audit=false" >> "$GITHUB_OUTPUT"
        else
          echo "azuread_authentication_only_mgmt = false — SQL authentication is enabled. Running the audit."
          echo "run_audit=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Get Alert Email Addresses
      id: get_alert_emails
      if: steps.check_sql_auth.outputs.run_audit == 'true'
      shell: bash
      env:
        OE_NAME:         ${{ fromJSON(inputs.target_environment).oe_name }}
        INFRA_APP_NAME:  ${{ fromJSON(inputs.target_environment).infra_app_name }}
        STAGE:           ${{ fromJSON(inputs.target_environment).stage }}
        CONFIG_DIR:      ${{ inputs.config_dir }}
      run: |
        set -euo pipefail
        env_dir="${CONFIG_DIR}/config/${OE_NAME}/${INFRA_APP_NAME}/${STAGE}"

        # Core alerting email — HCL vars.tfvars
        core_email=$(sed -n '/alerting_core/,${/email_address[[:space:]]*=/ {s/.*email_address[[:space:]]*=[[:space:]]*"//;s/"$//;p;q}}' "${env_dir}/vars.tfvars")
        echo "Core email: ${core_email}"

        # Extension alerting emails — YAML extensions/*.yml
        all_emails="${core_email}"
        for filename in "${env_dir}/extensions/"*.yml; do
          [ -e "$filename" ] || continue
          ext_email=$(sed -n '/alerting/,${/email_address[[:space:]]*:/ {s/.*email_address[[:space:]]*:[[:space:]]*"//;s/"$//;p;q}}' "$filename")
          ext_name=$(sed -n '0,/name[[:space:]]*:/ {s/.*name[[:space:]]*:[[:space:]]*"//;s/"$//;p;q}' "$filename")
          echo "Extension '${ext_name}' email: ${ext_email}"
          if [[ -n "$ext_email" && "$all_emails" != *"$ext_email"* ]]; then
            all_emails="${all_emails},${ext_email}"
          fi
        done

        echo "All recipients: ${all_emails}"
        echo "all_emails=${all_emails}" >> "$GITHUB_OUTPUT"

    - name: Query sys.sql_logins from master
      id: query_master
      if: steps.check_sql_auth.outputs.run_audit == 'true'
      shell: pwsh
      env:
        SQL_SERVER:        ${{ fromJSON(fromJSON(inputs.terraform_outputs).mgmt_details.value).synapse_workspace.name }}.sql.azuresynapse.net
        ARM_CLIENT_ID:     ${{ inputs.arm_client_id }}
        ARM_CLIENT_SECRET: ${{ inputs.arm_client_secret }}
      run: |
        $ErrorActionPreference = "Stop"
        $PSNativeCommandUseErrorActionPreference = $true
        $conn = "Server=tcp:$($env:SQL_SERVER),1433;Initial Catalog=master;Encrypt=True;Authentication=Active Directory Service Principal;User Id=$($env:ARM_CLIENT_ID);Password=$($env:ARM_CLIENT_SECRET)"

        $rows = Invoke-Sqlcmd -ConnectionString $conn `
          -Query "SELECT principal_id, name, create_date, modify_date, DATEDIFF(DAY, modify_date, SYSUTCDATETIME()) AS password_age_days FROM sys.sql_logins WHERE name NOT IN ('sqladminuser') AND is_disabled = 0;"

        if ($null -eq $rows -or $rows.Count -eq 0) {
          Write-Host "No local SQL logins found."
          echo "logins_json=[]" >> $env:GITHUB_OUTPUT
        } else {
          $arr = $rows | ForEach-Object {
            @{
              principal_id      = [int]$_.principal_id
              name              = [string]$_.name
              create_date       = $_.create_date.ToString("yyyy-MM-ddTHH:mm:ss")
              modify_date       = $_.modify_date.ToString("yyyy-MM-ddTHH:mm:ss")
              password_age_days = [int]$_.password_age_days
            }
          }
          $json = $arr | ConvertTo-Json -Compress -AsArray
          Write-Host "Logins found: $json"
          echo "logins_json=$json" >> $env:GITHUB_OUTPUT
        }

    - name: Upsert logins into dedicated pool audit table
      if: steps.check_sql_auth.outputs.run_audit == 'true'
      shell: pwsh
      env:
        SQL_SERVER:        ${{ fromJSON(fromJSON(inputs.terraform_outputs).mgmt_details.value).synapse_workspace.name }}.sql.azuresynapse.net
        SQL_POOL:          ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_sql_pool_name.value }}
        LOGINS_JSON:       ${{ steps.query_master.outputs.logins_json }}
        ARM_CLIENT_ID:     ${{ inputs.arm_client_id }}
        ARM_CLIENT_SECRET: ${{ inputs.arm_client_secret }}
      run: |
        $conn = "Server=tcp:$($env:SQL_SERVER),1433;Initial Catalog=$($env:SQL_POOL);Encrypt=True;Authentication=Active Directory Service Principal;User Id=$($env:ARM_CLIENT_ID);Password=$($env:ARM_CLIENT_SECRET)"

        $logins = $env:LOGINS_JSON | ConvertFrom-Json

        if ($logins.Count -eq 0) {
          Write-Host "No logins to upsert."
          exit 0
        }

        foreach ($login in $logins) {
          Write-Host "Upserting: $($login.name)"
          Invoke-Sqlcmd -ConnectionString $conn `
            -Query "EXEC mgmt_xtinfra.infra_sqluser_passwordaudit @PrincipalID = $($login.principal_id), @LocalUserName = '$($login.name)', @DateOfCreation = '$($login.create_date)', @DateOfLastModified = '$($login.modify_date)', @PasswordAgeDays = $($login.password_age_days);"
        }

        Write-Host "Upsert complete for $($logins.Count) login(s)."

    - name: Disable overdue logins (GracePeriodAndNotified 31+ days ago)
      if: steps.check_sql_auth.outputs.run_audit == 'true'
      shell: pwsh
      env:
        SQL_SERVER:        ${{ fromJSON(fromJSON(inputs.terraform_outputs).mgmt_details.value).synapse_workspace.name }}.sql.azuresynapse.net
        SQL_POOL:          ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_sql_pool_name.value }}
        ARM_CLIENT_ID:     ${{ inputs.arm_client_id }}
        ARM_CLIENT_SECRET: ${{ inputs.arm_client_secret }}
      run: |
        $ErrorActionPreference = "Stop"
        $PSNativeCommandUseErrorActionPreference = $true
        $poolConn   = "Server=tcp:$($env:SQL_SERVER),1433;Initial Catalog=$($env:SQL_POOL);Encrypt=True;Authentication=Active Directory Service Principal;User Id=$($env:ARM_CLIENT_ID);Password=$($env:ARM_CLIENT_SECRET)"
        $masterConn = "Server=tcp:$($env:SQL_SERVER),1433;Initial Catalog=master;Encrypt=True;Authentication=Active Directory Service Principal;User Id=$($env:ARM_CLIENT_ID);Password=$($env:ARM_CLIENT_SECRET)"

        # Only disable after 31+ days since notification — ensures the full 30-day SR window has elapsed
        $overdue = Invoke-Sqlcmd -ConnectionString $poolConn `
          -Query "SELECT LocalUserName FROM mgmt_xtinfra.infra_sqluser_password_master WHERE PasswordStatus = 'GracePeriodAndNotified' AND DATEDIFF(DAY, NotificationDate, SYSUTCDATETIME()) >= 31;"

        if ($null -eq $overdue -or $overdue.Count -eq 0) {
          Write-Host "No logins overdue for disabling."
          exit 0
        }

        foreach ($row in $overdue) {
          $user = $row.LocalUserName
          Write-Host "Disabling login: $user"

          Invoke-Sqlcmd -ConnectionString $masterConn `
            -Query "ALTER LOGIN [$user] DISABLE;"

          Invoke-Sqlcmd -ConnectionString $poolConn `
            -Query "UPDATE mgmt_xtinfra.infra_sqluser_password_master SET PasswordStatus = 'Disabled' WHERE LocalUserName = '$user';"
        }

        Write-Host "Disable step complete."

    - name: Query GracePeriod users (pending notification)
      id: query_grace
      if: steps.check_sql_auth.outputs.run_audit == 'true'
      shell: pwsh
      env:
        SQL_SERVER:        ${{ fromJSON(fromJSON(inputs.terraform_outputs).mgmt_details.value).synapse_workspace.name }}.sql.azuresynapse.net
        SQL_POOL:          ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_sql_pool_name.value }}
        ARM_CLIENT_ID:     ${{ inputs.arm_client_id }}
        ARM_CLIENT_SECRET: ${{ inputs.arm_client_secret }}
      run: |
        $conn = "Server=tcp:$($env:SQL_SERVER),1433;Initial Catalog=$($env:SQL_POOL);Encrypt=True;Authentication=Active Directory Service Principal;User Id=$($env:ARM_CLIENT_ID);Password=$($env:ARM_CLIENT_SECRET)"

        $results = Invoke-Sqlcmd -ConnectionString $conn `
          -Query "SELECT LocalUserName, PasswordAgeDays FROM mgmt_xtinfra.infra_sqluser_password_master WHERE PasswordStatus = 'GracePeriod' AND NotificationDate IS NULL;"

        if ($null -eq $results -or $results.Count -eq 0) {
          Write-Host "No users in GracePeriod awaiting notification."
          echo "users_json=[]" >> $env:GITHUB_OUTPUT
          echo "has_users=false" >> $env:GITHUB_OUTPUT
        } else {
          $arr = $results | ForEach-Object {
            @{
              username          = $_.LocalUserName
              password_age_days = [int]$_.PasswordAgeDays
            }
          }
          $json = $arr | ConvertTo-Json -Compress -AsArray
          Write-Host "Users to notify: $json"
          echo "users_json=$json" >> $env:GITHUB_OUTPUT
          echo "has_users=true" >> $env:GITHUB_OUTPUT
        }

    - name: Download Allianz Root CA
      if: steps.query_grace.outputs.has_users == 'true'
      shell: bash
      run: |
        curl -fsSL https://rootca.allianz.com/download/rootca3_base64.cer -o /tmp/allianz_rootca.pem
        echo "ALLIANZ_CA_CERT=/tmp/allianz_rootca.pem" >> $GITHUB_ENV

    - name: Send Email Notification
      id: send_email
      if: steps.query_grace.outputs.has_users == 'true'
      shell: bash
      env:
        USERS_JSON:      ${{ steps.query_grace.outputs.users_json }}
        RECIPIENTS:      ${{ steps.get_alert_emails.outputs.all_emails }}
        SMTP_SERVER:     "tmu-s.mail.allianz"
        SMTP_USERNAME:   "spf_m_user@allianz.com"
        SMTP_PASSWORD:   ${{ inputs.smtp_password }}
        FROM_ADDRESS:    "adp-technicalservices@allianz.com"
        ALLIANZ_CA_CERT: ${{ env.ALLIANZ_CA_CERT }}
        NOTIFIED_USERS_FILE: ${{ github.action_path }}/notified_users.json
        ACTION_PATH:     ${{ github.action_path }}
      run: |
        python3 "$ACTION_PATH/../../../../code/scripts/sql_pool_password_audit_sendmail.py"

    - name: Update PasswordStatus to GracePeriodAndNotified
      if: steps.query_grace.outputs.has_users == 'true'
      shell: pwsh
      env:
        SQL_SERVER:        ${{ fromJSON(fromJSON(inputs.terraform_outputs).mgmt_details.value).synapse_workspace.name }}.sql.azuresynapse.net
        SQL_POOL:          ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_sql_pool_name.value }}
        ARM_CLIENT_ID:     ${{ inputs.arm_client_id }}
        ARM_CLIENT_SECRET: ${{ inputs.arm_client_secret }}
        ALL_EMAILS:        ${{ steps.get_alert_emails.outputs.all_emails }}
        ACTION_PATH:       ${{ github.action_path }}
      run: |
        $conn = "Server=tcp:$($env:SQL_SERVER),1433;Initial Catalog=$($env:SQL_POOL);Encrypt=True;Authentication=Active Directory Service Principal;User Id=$($env:ARM_CLIENT_ID);Password=$($env:ARM_CLIENT_SECRET)"

        $notifiedUsers = Get-Content "$($env:ACTION_PATH)/notified_users.json" | ConvertFrom-Json

        foreach ($user in $notifiedUsers) {
          Write-Host "Marking $($user.username) as GracePeriodAndNotified"
          Invoke-Sqlcmd `
            -ConnectionString $conn `
            -Query "EXEC mgmt_xtinfra.infra_sqluser_passwordnotify @UserName = '$($user.username)', @EmailId = '$($env:ALL_EMAILS)';"
        }
