name: 'Migration Synapse Part'
description: 'Synapse part of Synapse to Fabric migration'

inputs:
  subscription_id:
    required: true
    type: string
  synapse_workspace:
    required: true
    type: string
  sql_pool_name:
    required: true
    type: string
  storage_account_resource_group:
    required: true
    type: string
  storage_account_name:
    required: true
    type: string
  fabric_service_principal:
    required: true
    type: string
  arm_client_id:
    required: true
  arm_client_secret:
    required: true
  arm_tenant_id:
    required: true

runs:
  using: "composite"
  steps:
  - name: Azure Login
    id: az_login
    shell: bash
    working-directory: ./
    env:
      ARM_CLIENT_ID: ${{ inputs.arm_client_id }}
      ARM_CLIENT_SECRET: ${{ inputs.arm_client_secret }}
      ARM_TENANT_ID: ${{ inputs.arm_tenant_id }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
    run: |
      set -euo pipefail
      az login --service-principal \
      --username "${ARM_CLIENT_ID}" \
      --password "${ARM_CLIENT_SECRET}" \
      --tenant "${ARM_TENANT_ID}" \
      --output none
      az account set \
      --subscription ${ARM_SUBSCRIPTION_ID} \
      --output none

  - name: Calculate tables hashes before data transfer
    shell: pwsh
    env:
      SQL_SERVER:        ${{ inputs.synapse_workspace }}.sql.azuresynapse.net
      SQL_POOL:          ${{ inputs.sql_pool_name }}
      ARM_CLIENT_ID:     ${{ inputs.arm_client_id }}
      ARM_CLIENT_SECRET: ${{ inputs.arm_client_secret }}
    run: |
      $ErrorActionPreference = "Stop"
      $PSNativeCommandUseErrorActionPreference = $true
      $conn = "Server=tcp:$($env:SQL_SERVER),1433;Initial Catalog=$($env:SQL_POOL);Encrypt=True;Authentication=Active Directory Service Principal;User Id=$($env:ARM_CLIENT_ID);Password=$($env:ARM_CLIENT_SECRET)"

      Write-Host "Starting hash calculation."

      Invoke-Sqlcmd -ConnectionString $conn `
        -Query "EXEC [mgmt_xtinfra].[infra_migration_hash_calculation] @run_mode = 'SYNAPSE';" `
        -Verbose

      Write-Host "Hash calculation is completed for all tables."

  - name: Create external tables to transfer data
    shell: pwsh
    env:
      SQL_SERVER:        ${{ inputs.synapse_workspace }}.sql.azuresynapse.net
      SQL_POOL:          ${{ inputs.sql_pool_name }}
      ARM_CLIENT_ID:     ${{ inputs.arm_client_id }}
      ARM_CLIENT_SECRET: ${{ inputs.arm_client_secret }}
    run: |
      $ErrorActionPreference = "Stop"
      $PSNativeCommandUseErrorActionPreference = $true
      $conn = "Server=tcp:$($env:SQL_SERVER),1433;Initial Catalog=$($env:SQL_POOL);Encrypt=True;Authentication=Active Directory Service Principal;User Id=$($env:ARM_CLIENT_ID);Password=$($env:ARM_CLIENT_SECRET)"

      Write-Host "Starting table export."

      Invoke-Sqlcmd -ConnectionString $conn `
        -Query "EXEC [mgmt_xtinfra].[infra_export_tables];" `
        -Verbose

      Write-Host "Export is completed for all tables."

  - name: Assign role to Fabric SP on storage account
    id: azure_role_assignment
    shell: bash
    working-directory: ./
    env:
      FABRIC_SP: ${{ inputs.fabric_service_principal }}
      RESOURCE_GROUP: ${{ inputs.storage_account_resource_group }}
      STORAGE_ACCOUNT: ${{ inputs.storage_account_name }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
    run: |
      echo "Looking up Object ID for Service Principal: ${FABRIC_SP}"

      # Query Entra ID for the Object ID using the Display Name
      SP_OBJECT_ID=$(az ad sp list --display-name "${FABRIC_SP}" --query "[0].id" -o tsv)

      if [ -z "$SP_OBJECT_ID" ]; then
        echo "Error: Could not find a Service Principal with the name ${FABRIC_SP}"
        exit 1
      fi

      echo "Found Object ID: $SP_OBJECT_ID"
      # Construct the scope for the specific storage account
      SCOPE="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Storage/storageAccounts/${STORAGE_ACCOUNT}"

      echo "Assigning 'Storage Blob Data Contributor' to ${FABRIC_SP} at scope $SCOPE"

      az role assignment create \
        --assignee "$SP_OBJECT_ID" \
        --role "Storage Blob Data Contributor" \
        --scope "$SCOPE"

      echo "Role assigned successfully."

      echo "Assigning 'Storage Account Contributor' to ${FABRIC_SP} at scope $SCOPE"

      az role assignment create \
        --assignee "$SP_OBJECT_ID" \
        --role "Storage Account Contributor" \
        --scope "$SCOPE"

      echo "Role assigned successfully."
