name: 'Install Database Package'
description: 'Show database changes on PR, deploy on push to main if deploy window allows'

inputs:
  target_environment:
    required: true
    type: string
  terraform_outputs:
    required: true
    type: string
  db_development_dir:
    required: true
    type: string
  result_caching_enabled:
    required: false
    type: boolean
    default: false
    description: "Specifies whether result caching should be turned on for the database"
  arm_client_id:
    required: true
  arm_client_secret:
    required: true
  arm_tenant_id:
    required: true

runs:
  using: "composite"
  steps:
  - name: debug inputs
    shell: bash
    env:
      REPO_NAME: ${{ github.event.repository.name  }}
    run: |
      set -euo pipefail
      echo ${REPO_NAME}

  - name: Prep environment
    id: prep_environment
    shell: bash
    env:
      TARGET_OE_NAME: ${{ fromJSON(inputs.target_environment).oe_name }}
      TARGET_INFRA_APP_NAME: ${{ fromJSON(inputs.target_environment).infra_app_name }}
      TARGET_STAGE: ${{ fromJSON(inputs.target_environment).stage }}
      DEPLOY_MGMT_VERSION: ${{ fromJSON(inputs.target_environment).deploy.mgmt.version }}
      TMP_WORKDIR: ${{ github.workspace }}/tmp
      MGMT_DETAILS: ${{ fromJSON(inputs.terraform_outputs).mgmt_details.value }}
    run: |
      set -euo pipefail

      mkdir -p "${TMP_WORKDIR}"

      # Function to safely set environment variables with heredoc delimiters
      set_env_var() {
        local var_name="$1"
        local var_value="$2"
        local delimiter
        delimiter="$(openssl rand -hex 8)"
        {
          echo "${var_name}<<${delimiter}"
          echo "${var_value}"
          echo "${delimiter}"
        } >> $GITHUB_ENV
      }

      set_env_var "TMP_WORKDIR" "${TMP_WORKDIR}"
      set_env_var "DEPLOY_MGMT_VERSION" "${DEPLOY_MGMT_VERSION}"
      set_env_var "TARGET_OE_NAME" "${TARGET_OE_NAME}"
      set_env_var "TARGET_INFRA_APP_NAME" "${TARGET_INFRA_APP_NAME}"
      set_env_var "TARGET_STAGE" "${TARGET_STAGE}"

      synapse_workspace=$(echo "${MGMT_DETAILS}" | jq -r '.synapse_workspace')
      collation=$(echo "${synapse_workspace}" | jq -r 'if has("sql_pool_collations") then .sql_pool_collations[] else "" end')
      echo "collation is ${collation}"
      set_env_var "COLLATION" "${collation}"
      if [[ "${collation}" == *"_CI_"* ]] || [ "${collation}" == "" ]; then
        set_env_var "IS_COLLATION_CI" "true"
      else
        set_env_var "IS_COLLATION_CI" "false"
      fi

  # Modify Database project collation
  - name: Modify Database project collation
    id: set_collation
    if: env.IS_COLLATION_CI == 'false'
    shell: bash
    working-directory: ${{ inputs.db_development_dir }}/code/sql
    run: |
      echo "Modifying sqlproj file"
      sed -i 's#<DefaultCollation>.*</DefaultCollation>#<DefaultCollation>"${COLLATION}"</DefaultCollation>#' sqlDbProject.sqlproj

  - name: Build project model
    id: build_project
    working-directory: ${{ inputs.db_development_dir }}/code/sql
    env:
      IS_ADP: ${{ env.TARGET_OE_NAME != 'simplifi' }}
    shell: bash
    run: |
      set -euo pipefail
      build_output_dir=${TMP_WORKDIR}/db-project-${TARGET_OE_NAME}-${TARGET_INFRA_APP_NAME}-${TARGET_STAGE}
      mkdir -p ${build_output_dir}

      echo "build project model, version ${DEPLOY_MGMT_VERSION}"
      /usr/bin/dotnet build /p:NetCoreBuild=true \
      /p:IncludeADPProc=$IS_ADP \
      --configuration Release \
      --output "${build_output_dir}"

      ls -la "${build_output_dir}"
      echo "output_dir=${build_output_dir}" >> "$GITHUB_OUTPUT"

  - name: Azure Login
    id: az_login
    shell: bash
    working-directory: ./
    env:
      ARM_CLIENT_ID: ${{ inputs.arm_client_id }}
      ARM_CLIENT_SECRET: ${{ inputs.arm_client_secret }}
      ARM_TENANT_ID: ${{ inputs.arm_tenant_id }}
      ARM_SUBSCRIPTION_ID: ${{ fromJSON(inputs.target_environment).subscriptionId }}
    run: |
      set -euo pipefail
      az login --service-principal \
      --username "${ARM_CLIENT_ID}" \
      --password "${ARM_CLIENT_SECRET}" \
      --tenant "${ARM_TENANT_ID}" \
      --output none
      az account set \
      --subscription ${ARM_SUBSCRIPTION_ID} \
      --output none

  - name: Run pre deployment scripts
    if: ${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event.repository.name  == 'db-development' }}
    working-directory: ${{ inputs.db_development_dir }}/code/scripts
    shell: pwsh
    env:
      MGMT_SYNW_SQLPOOL_URI: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_uri_sql.value }}
      MGMT_SYNW_SQLPOOL_NAME: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_sql_pool_name.value }}
      ARM_CLIENT_ID: ${{ inputs.arm_client_id }}
      ARM_CLIENT_SECRET: ${{ inputs.arm_client_secret }}
    run: |
      echo "run pre deployment script"
      $SQL_CONNECTION_STRING = "Server=tcp:$($env:MGMT_SYNW_SQLPOOL_URI),1433;Initial Catalog=$($env:MGMT_SYNW_SQLPOOL_NAME);Encrypt=True;Authentication=Active Directory Service Principal;User Id=$($env:ARM_CLIENT_ID); Password=$($env:ARM_CLIENT_SECRET)"
      Invoke-Sqlcmd `
        -ConnectionString $SQL_CONNECTION_STRING `
        -InputFile "Script.PreDeployment1.sql" `
        -Verbose
  # Register Database deployment
  - name: Register deployment start
    id: register_deployment
    if: ${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event.repository.name == 'db-development' }}
    shell: pwsh
    env:
      MGMT_SYNW_SQLPOOL_URI: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_uri_sql.value }}
      MGMT_SYNW_SQLPOOL_NAME: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_sql_pool_name.value }}
      MGMT_SYNW_WORKSPACE_NAME: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_name.value }}
      ARM_CLIENT_ID: ${{ inputs.arm_client_id }}
      ARM_CLIENT_SECRET: ${{ inputs.arm_client_secret }}
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    run: |
      echo "Registering deployment start for RUN_ID=$($env:RUN_ID)"
      $SQL_CONNECTION_STRING = "Server=tcp:$($env:MGMT_SYNW_SQLPOOL_URI),1433;Initial Catalog=$($env:MGMT_SYNW_SQLPOOL_NAME);Encrypt=True;Authentication=Active Directory Service Principal;User Id=$($env:ARM_CLIENT_ID); Password=$($env:ARM_CLIENT_SECRET)"

      Invoke-Sqlcmd `
        -ConnectionString $SQL_CONNECTION_STRING `
        -Query "IF OBJECT_ID(N'mgmt_xtinfra.infra_mgmt_version_config', N'U') IS NULL BEGIN CREATE TABLE mgmt_xtinfra.infra_mgmt_version_config ([run_id] [nvarchar](128) COLLATE LATIN1_GENERAL_100_CI_AS_SC_UTF8 NOT NULL, [mgmt_deployment_version] [nvarchar](100) COLLATE LATIN1_GENERAL_100_CI_AS_SC_UTF8 NULL, [mgmt_deployment_status] [nvarchar](25) COLLATE LATIN1_GENERAL_100_CI_AS_SC_UTF8 NULL, [workspace_name] [nvarchar](100) COLLATE LATIN1_GENERAL_100_CI_AS_SC_UTF8 NULL, [app_name] [nvarchar](20) COLLATE LATIN1_GENERAL_100_CI_AS_SC_UTF8 NULL, [db_name] [nvarchar](20) COLLATE LATIN1_GENERAL_100_CI_AS_SC_UTF8 NULL, [created_at] [datetime] NOT NULL, [updated_at] [datetime] NOT NULL) WITH (DISTRIBUTION = ROUND_ROBIN, CLUSTERED INDEX ([run_id])) END" `
        -OutputSqlErrors $true

      Invoke-Sqlcmd `
        -ConnectionString $SQL_CONNECTION_STRING `
        -Query "DECLARE @now datetime = GETDATE(); INSERT INTO mgmt_xtinfra.infra_mgmt_version_config (run_id, mgmt_deployment_version, mgmt_deployment_status, workspace_name, app_name, db_name, created_at, updated_at) VALUES ('$($env:RUN_ID)', '$($env:DEPLOY_MGMT_VERSION)', 'IN_PROGRESS', '$($env:MGMT_SYNW_WORKSPACE_NAME)', 'db-development', '$($env:MGMT_SYNW_SQLPOOL_NAME)', @now, @now)" `
        -OutputSqlErrors $true
      echo "Inserted IN_PROGRESS row: run_id=$($env:RUN_ID), version=$($env:DEPLOY_MGMT_VERSION), workspace=$($env:MGMT_SYNW_WORKSPACE_NAME)"

      "RUN_ID=$($env:RUN_ID)" >> $env:GITHUB_OUTPUT

  - name: Generate Report
    working-directory: ./
    shell: bash
    env:
      MGMT_SYNW_SQLPOOL_NAME: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_sql_pool_name.value }}
      MGMT_SYNW_SQLPOOL_URI: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_uri_sql.value }}
      PROJECT_BUILD_OUTPUT_DIR: ${{ steps.build_project.outputs.output_dir }}
      ARM_CLIENT_ID: ${{ inputs.arm_client_id }}
      ARM_CLIENT_SECRET: ${{ inputs.arm_client_secret }}
    run: |
      set -euo pipefail
      echo "generate report"
      SQL_CONNECTION_STRING="Server=tcp:${MGMT_SYNW_SQLPOOL_URI},1433;Initial Catalog=${MGMT_SYNW_SQLPOOL_NAME};Encrypt=True;Authentication=Active Directory Service Principal;User Id=${ARM_CLIENT_ID}; Password=${ARM_CLIENT_SECRET}"

      ~/sqlpackage/sqlpackage \
        /Action:DeployReport \
        /SourceFile:"${PROJECT_BUILD_OUTPUT_DIR}/sqlDbProject.dacpac" \
        /TargetConnectionString:"${SQL_CONNECTION_STRING}" \
        /OutputPath:"${PROJECT_BUILD_OUTPUT_DIR}/deployReport.xml" \
        /p:VerifyCollationCompatibility=true \
        /p:VerifyDeployment=true

      ls -la ${PROJECT_BUILD_OUTPUT_DIR}

      # xml to json, show output
      cat ${PROJECT_BUILD_OUTPUT_DIR}/deployReport.xml \
      | xq '.' \
      | tee ${PROJECT_BUILD_OUTPUT_DIR}/deployReport.json

  - name: Summarize Report
    id: summarize_report
    working-directory: ./
    shell: bash
    env:
      PROJECT_BUILD_OUTPUT_DIR: ${{ steps.build_project.outputs.output_dir }}
    run: |
      set -euo pipefail
      echo "summarize report"

      # build a summary
      operations=$(
        cat ${PROJECT_BUILD_OUTPUT_DIR}/deployReport.json \
        | jq -rc '
          [ .DeploymentReport.Operations.Operation ] // []
          | flatten
          | map("\(.["@Name"]): \([ .Item ] // [] | flatten | length)")
         | join(", ")
        '
      )

      # TODO: alerts format?
      # TODO: stop on alerts?
      # alerts=$(
      #   cat ${PROJECT_BUILD_OUTPUT_DIR}/deployReport.json \
      #   | jq -rc '
      #     .DeploymentReport.Alerts // []
      #    | join(", ")
      #   '
      # )
      alerts="TODO"

      echo "operations=${operations}" >> "${GITHUB_OUTPUT}"
      echo "alerts=${alerts}" >> "${GITHUB_OUTPUT}"

  - name: Create report annotation
    shell: bash
    env:
      OPERATIONS: ${{ steps.summarize_report.outputs.operations }}
      ALERTS: ${{ steps.summarize_report.outputs.alerts }}
      MGMT_SYNW_NAME: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_name.value }}
      MGMT_SYNW_SQLPOOL_NAME: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_sql_pool_name.value }}
    run: |
      set -euo pipefail
      echo "::notice ::Database plan: ${OPERATIONS} - ${MGMT_SYNW_NAME}-${MGMT_SYNW_SQLPOOL_NAME}"

  # ATDP-365: Workspaces are created dynamically
  # ATDP-365: Schemas are currently hard-coded as they are only available for SPF;
  #           they should come through self-service for ADP;
  #           use an empty array for now
  - name: Prepare database inputs
    id: prep_db_inputs
    shell: bash
    env:
      MGMT_DETAILS: ${{ fromJSON(inputs.terraform_outputs).mgmt_details.value }}
      CORE_DETAILS: ${{ fromJSON(inputs.terraform_outputs).core_details.value }}
      EXTENSION_DETAILS: ${{ fromJSON(inputs.terraform_outputs).extension_details.value }}
    run: |
      set -euo pipefail

      INTERNAL_ENV="false"

      function log
        {
          echo "["$(date "+%Y.%m.%d %H:%M:%S")"] - INFO - "${1}
        }

      function error_exit
        {
          if [[ "${INTERNAL_ENV}" == "true" ]]; then
            echo -e ${Amber} "["$(date "+%Y.%m.%d %H:%M:%S")"] - WARNING - ${1:-"Warning triggered (internal environment/Skip error flag detected)"}" ${Color_Off}
            return 0
          else
            echo -e ${Red} "["$(date "+%Y.%m.%d %H:%M:%S")"] - ERROR - ${1:-"Unknown Error"}" ${Color_Off} 1>&2
            exit -1
          fi
        }

      Red='\033[0;31m'
      BGreen='\033[1;32m'
      Amber='\033[38;5;214m'
      Color_Off='\033[0m'
      TICK=$(printf '\xE2\x9C\x93')

      log "extension input validation for ${TARGET_OE_NAME} environment"
      log "Finding the MGMT workspace"
      WS_NAME=$(echo "${MGMT_DETAILS}" | jq -r '.. | .synapse_workspace?.name? // empty')

      if [ ${WS_NAME} = "synw-spf-0091-dev-mgmt" ] || [ ${WS_NAME} = "synw-tdp-e2e001-dev-mgmt" ] || [ ${WS_NAME} = "synw-spf-0091-prp-mgmt" ]; then
        INTERNAL_ENV="true"
        log "${WS_NAME} identified as internal workspace hence errors will be considered as warning"
      fi

      EXT_VAL_FN()
        {
          log "Validating Uniqueness of SchemaNames for each extensions"
          DUPLICATE=$(echo ${1} | jq -r '.[].ext_schema_name[]' | sort | uniq -d)

          if [ -n "$DUPLICATE" ]; then
            log "Duplicate values found - "$DUPLICATE""
            error_exit "Duplicate ext_schema_name found!"
          else
            echo -e ${BGreen}"SchemaName Unique test has been Passed Successfully ${TICK}" ${Color_Off}
          fi

          log "Validating SchemaName pattern for each extensions"

          INVALID_PATTERN=$(echo "$1" | jq -r '.[].ext_schema_name[]' | grep -vE '^(ext[0-9]{3}|tdp_ext[0-9]{3})$' || true)

          if [ -n "$INVALID_PATTERN" ]; then
            log "Invalid Patten Found - ${INVALID_PATTERN}"
            error_exit "Invalid schema naming convention (expected format: tdp_extNNN[ADP] or extNNN[simplifi])"
          else
            echo -e ${BGreen}"SchemaName pattern check has been Passed Successfully ${TICK}" ${Color_Off}
          fi

          log "Validating Synapse Workspace for each extension"

          # Any extension missing workspace id OR name
          MISSING_WS=$(echo ${1} | jq -r '
          .[]
          | select(
            (.synapse_workspace.id == null or .synapse_workspace.id == "" or .synapse_workspace.id == "#")
            or
            (.synapse_workspace.name == null or .synapse_workspace.name == "" or .synapse_workspace.name == "#")
            )
            | {extension_name: .name, workspace: .synapse_workspace}
          ')

          if [ "$MISSING_WS" != "" ]; then
            log "The following extensions do not have valid synapse workspace:"
            echo "$MISSING_WS"
            error_exit "Synapse Workspace validation FAILED!"
          else
            echo  -e ${BGreen}"Synapse Workspace validation has been Passed Successfully ${TICK}" ${Color_Off}
          fi
      }

      EXT_VAL_FN "${EXTENSION_DETAILS}"

      echo "prepare database inputs"
      db_input_mgmt_details=$(echo "${MGMT_DETAILS}" | jq -c '.' | sed "s/\"/|/g")
      echo "mgmt_details=${db_input_mgmt_details}" >> "${GITHUB_OUTPUT}"

      db_input_core_details=$(echo "${CORE_DETAILS}" | jq -c '.' | sed "s/\"/|/g")
      echo "core_details=${db_input_core_details}" >> "${GITHUB_OUTPUT}"

      db_input_extension_details=$(echo "${EXTENSION_DETAILS}" | jq -c '.' | sed "s/\"/|/g")
      echo "extension_details=${db_input_extension_details}" >> "${GITHUB_OUTPUT}"

      db_input_synapse_workspaces=$(
        echo '{}' | jq -c --argjson cc "${CORE_DETAILS}" --argjson ee "${EXTENSION_DETAILS}" \
        '
          ($cc | .app_schema) + ($ee | map(.ext_schema_name) | flatten)
          | map({name: .})
          | unique_by(.name)
        '
      )
      echo "workspaces=$db_input_synapse_workspaces" >> "${GITHUB_OUTPUT}"

      db_input_schemas='[]'
      echo "schemas=${db_input_schemas}" >> "${GITHUB_OUTPUT}"

  - name: Generate Publish Script
    working-directory: ./
    shell: bash
    env:
      MGMT_SYNW_SQLPOOL_NAME: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_sql_pool_name.value }}
      MGMT_SYNW_SQLPOOL_URI: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_uri_sql.value }}
      PROJECT_BUILD_OUTPUT_DIR: ${{ steps.build_project.outputs.output_dir }}
      DB_INPUT_MGMT_DETAILS: ${{ steps.prep_db_inputs.outputs.mgmt_details }}
      DB_INPUT_CORE_DETAILS: ${{ steps.prep_db_inputs.outputs.core_details }}
      DB_INPUT_EXTENSION_DETAILS: ${{ steps.prep_db_inputs.outputs.extension_details }}
      DB_INPUT_WORKSPACES: ${{ steps.prep_db_inputs.outputs.workspaces }}
      DB_INPUT_SCHEMAS: ${{ steps.prep_db_inputs.outputs.schemas }}
      ARM_CLIENT_ID: ${{ inputs.arm_client_id }}
      ARM_CLIENT_SECRET: ${{ inputs.arm_client_secret }}
    run: |
      set -euo pipefail
      echo "generate publish script"
      SQL_CONNECTION_STRING="Server=tcp:${MGMT_SYNW_SQLPOOL_URI},1433;Initial Catalog=${MGMT_SYNW_SQLPOOL_NAME};Encrypt=True;Authentication=Active Directory Service Principal;User Id=${ARM_CLIENT_ID}; Password=${ARM_CLIENT_SECRET}"

      echo "DB_INPUT_CORE_DETAILS is ${DB_INPUT_CORE_DETAILS}"
      echo "DB_INPUT_MGMT_DETAILS is ${DB_INPUT_MGMT_DETAILS}"
      echo "DB_INPUT_EXTENSION_DETAILS is ${DB_INPUT_EXTENSION_DETAILS}"
      echo "DB_INPUT_WORKSPACES is ${DB_INPUT_WORKSPACES}"
      echo "DB_INPUT_SCHEMAS is ${DB_INPUT_SCHEMAS}"

      ~/sqlpackage/sqlpackage \
        /Action:Script \
        /SourceFile:"${PROJECT_BUILD_OUTPUT_DIR}/sqlDbProject.dacpac" \
        /TargetConnectionString:"${SQL_CONNECTION_STRING}" \
        /OutputPath:"${PROJECT_BUILD_OUTPUT_DIR}/deployScript.sql" \
        /p:VerifyCollationCompatibility=true \
        /p:VerifyDeployment=true \
        /p:BlockOnPossibleDataLoss=true \
        /p:DropObjectsNotInSource=false \
        /v:mgmt="${DB_INPUT_MGMT_DETAILS}" \
        /v:app="${DB_INPUT_CORE_DETAILS}" \
        /v:extensions="${DB_INPUT_EXTENSION_DETAILS}" \
        /v:workspaces="${DB_INPUT_WORKSPACES}" \
        /v:schemas="${DB_INPUT_SCHEMAS}"

      ls -la "${PROJECT_BUILD_OUTPUT_DIR}"
      head -n 20 "${PROJECT_BUILD_OUTPUT_DIR}/deployScript.sql"

  - name: Comment changes
    uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
    if: ${{ github.event_name == 'pull_request' }}
    with:
      github-token: ${{ github.token }}
      script: |
        const fs = require("fs");
        const reportFileName = "${{ steps.build_project.outputs.output_dir }}/deployReport.json"
        var report = fs.readFileSync(reportFileName, "utf8")

        const commentBody = `
        ### Database: attempt \`${{ github.run_attempt }}\`, run \`${{ github.run_id }}\`

        Change report summary:
        - Operations: \`${{ steps.summarize_report.outputs.operations }}\`
        - Alerts: \`${{ steps.summarize_report.outputs.alerts }}\`

        <details><summary>Show Full Report</summary>

        \`\`\`json\n
        ${report}
        \`\`\`

        </details>

        Event: \`${{ github.event_name }}\`, pushed by @${{ github.actor }}
        Workflow: \`${{ github.workflow }}\`, Job: \`${{ github.job }}\`, Step: \`${{ github.action }}\`
        Target: \`${{ fromJSON(inputs.target_environment).oe_name }}-${{ fromJson(inputs.target_environment).infra_app_name }}-${{ fromJSON(inputs.target_environment).stage }}\`

        `;

        await github.rest.issues.createComment({
          issue_number: context.issue.number,
          owner: context.repo.owner,
          repo: context.repo.repo,
          body: commentBody
        })

  - name: Publish changes
    if: ${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event.repository.name  == 'db-development' }}
    working-directory: ./
    shell: bash
    env:
      MGMT_SYNW_SQLPOOL_NAME: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_sql_pool_name.value }}
      MGMT_SYNW_SQLPOOL_URI: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_uri_sql.value }}
      PROJECT_BUILD_OUTPUT_DIR: ${{ steps.build_project.outputs.output_dir }}
      DB_INPUT_MGMT_DETAILS: ${{ steps.prep_db_inputs.outputs.mgmt_details }}
      DB_INPUT_CORE_DETAILS: ${{ steps.prep_db_inputs.outputs.core_details }}
      DB_INPUT_EXTENSION_DETAILS: ${{ steps.prep_db_inputs.outputs.extension_details }}
      DB_INPUT_WORKSPACES: ${{ steps.prep_db_inputs.outputs.workspaces }}
      DB_INPUT_SCHEMAS: ${{ steps.prep_db_inputs.outputs.schemas }}
      ARM_CLIENT_ID: ${{ inputs.arm_client_id }}
      ARM_CLIENT_SECRET: ${{ inputs.arm_client_secret }}
    run: |
      echo "publish changes"
      SQL_CONNECTION_STRING="Server=tcp:${MGMT_SYNW_SQLPOOL_URI},1433;Initial Catalog=${MGMT_SYNW_SQLPOOL_NAME};Encrypt=True;Authentication=Active Directory Service Principal;User Id=${ARM_CLIENT_ID}; Password=${ARM_CLIENT_SECRET}"

      echo "DB_INPUT_CORE_DETAILS is ${DB_INPUT_CORE_DETAILS}"
      echo "DB_INPUT_MGMT_DETAILS is ${DB_INPUT_MGMT_DETAILS}"
      echo "DB_INPUT_EXTENSION_DETAILS is ${DB_INPUT_EXTENSION_DETAILS}"
      echo "DB_INPUT_WORKSPACES is ${DB_INPUT_WORKSPACES}"
      echo "DB_INPUT_SCHEMAS is ${DB_INPUT_SCHEMAS}"

      cp "${PROJECT_BUILD_OUTPUT_DIR}/deployScript.sql" "${PROJECT_BUILD_OUTPUT_DIR}/deployScript-before-publish.sql"

      ~/sqlpackage/sqlpackage \
        /Action:Publish \
        /SourceFile:"${PROJECT_BUILD_OUTPUT_DIR}/sqlDbProject.dacpac" \
        /TargetConnectionString:"${SQL_CONNECTION_STRING}" \
        /Diagnostics:true \
        /p:VerifyCollationCompatibility=true \
        /p:VerifyDeployment=true \
        /p:BlockOnPossibleDataLoss=true \
        /p:DropObjectsNotInSource=false \
        /v:mgmt="${DB_INPUT_MGMT_DETAILS}" \
        /v:app="${DB_INPUT_CORE_DETAILS}" \
        /v:extensions="${DB_INPUT_EXTENSION_DETAILS}" \
        /v:workspaces="${DB_INPUT_WORKSPACES}" \
        /v:schemas="${DB_INPUT_SCHEMAS}"

      cp "${PROJECT_BUILD_OUTPUT_DIR}/deployScript.sql" "${PROJECT_BUILD_OUTPUT_DIR}/deployScript-after-publish.sql"
      ls -la "${PROJECT_BUILD_OUTPUT_DIR}"
      diff -u \
        ${PROJECT_BUILD_OUTPUT_DIR}/deployScript-before-publish.sql \
        ${PROJECT_BUILD_OUTPUT_DIR}/deployScript-after-publish.sql \
      || true

  # Modify Database project collation
  - name: Modify SPF Database project collation
    id: set_collation_spf
    if: ${{ env.TARGET_OE_NAME == 'simplifi' && env.IS_COLLATION_CI == 'false' }}
    shell: bash
    working-directory: ${{ inputs.db_development_dir }}/code/Simplifi
    run: |
      echo "Modifying simplifi sqlproj file"
      sed -i 's#<DefaultCollation>.*</DefaultCollation>#<DefaultCollation>"${COLLATION}"</DefaultCollation>#' sqlDbProjectSimplifi.sqlproj

  - name: Build simplifi project model
    id: build_project_spf
    if: ${{ env.TARGET_OE_NAME == 'simplifi' }}
    working-directory: ${{ inputs.db_development_dir }}/code/Simplifi
    shell: bash
    run: |
      set -euo pipefail
      build_output_dir=${TMP_WORKDIR}/spf-db-project-${TARGET_OE_NAME}-${TARGET_INFRA_APP_NAME}-${TARGET_STAGE}
      mkdir -p ${build_output_dir}

      echo "build spf project model, version ${DEPLOY_MGMT_VERSION}"
      /usr/bin/dotnet build /p:NetCoreBuild=true \
      --configuration Release \
      --output "${build_output_dir}"

      ls -la "${build_output_dir}"
      echo "output_dir=${build_output_dir}" >> "$GITHUB_OUTPUT"

  - name: Publish simplifi changes
    if: ${{ ((github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event.repository.name  == 'db-development') && env.TARGET_OE_NAME == 'simplifi'}}
    working-directory: ./
    shell: bash
    env:
      MGMT_SYNW_SQLPOOL_NAME: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_sql_pool_name.value }}
      MGMT_SYNW_SQLPOOL_URI: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_uri_sql.value }}
      PROJECT_BUILD_OUTPUT_DIR: ${{ steps.build_project_spf.outputs.output_dir }}
      ARM_CLIENT_ID: ${{ inputs.arm_client_id }}
      ARM_CLIENT_SECRET: ${{ inputs.arm_client_secret }}
    run: |
      echo "publish changes"
      SQL_CONNECTION_STRING="Server=tcp:${MGMT_SYNW_SQLPOOL_URI},1433;Initial Catalog=${MGMT_SYNW_SQLPOOL_NAME};Encrypt=True;Authentication=Active Directory Service Principal;User Id=${ARM_CLIENT_ID}; Password=${ARM_CLIENT_SECRET}"

      ~/sqlpackage/sqlpackage \
        /Action:Publish \
        /SourceFile:"${PROJECT_BUILD_OUTPUT_DIR}/sqlDbProjectSimplifi.dacpac" \
        /TargetConnectionString:"${SQL_CONNECTION_STRING}" \
        /Diagnostics:true \
        /p:VerifyCollationCompatibility=true \
        /p:VerifyDeployment=true \
        /p:BlockOnPossibleDataLoss=true \
        /p:DropObjectsNotInSource=false

  - name: Enable Result Caching
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && inputs.result_caching_enabled }}
    shell: pwsh
    env:
      MGMT_SYNW_SQLPOOL_URI: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_uri_sql.value }}
      MGMT_SYNW_SQLPOOL_NAME: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_sql_pool_name.value }}
      ARM_CLIENT_ID: ${{ inputs.arm_client_id }}
      ARM_CLIENT_SECRET: ${{ inputs.arm_client_secret }}
    run: |
      echo "enable result caching"

      $env:SQL_CONNECTION_STRING_MASTERDB="Server=tcp:$($env:MGMT_SYNW_SQLPOOL_URI),1433;Initial Catalog=master;Encrypt=True;Authentication=Active Directory Service Principal;User Id=$($env:ARM_CLIENT_ID); Password=$($env:ARM_CLIENT_SECRET)"

      Invoke-Sqlcmd `
        -ConnectionString "${env:SQL_CONNECTION_STRING_MASTERDB}" `
        -Query "ALTER DATABASE ${env:MGMT_SYNW_SQLPOOL_NAME} SET RESULT_SET_CACHING ON;"

  - name: Upload Database Artifacts
    uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf # v3.2.2
    with:
      name: db-artifacts-${{ fromJSON(inputs.target_environment).oe_name }}-${{ fromJSON(inputs.target_environment).infra_app_name }}-${{ fromJSON(inputs.target_environment).stage }}
      path: ${{ steps.build_project.outputs.output_dir }}

  - name: Update deployment status (success)
    if: ${{ success() && steps.register_deployment.outputs.RUN_ID != '' }}
    shell: pwsh
    env:
      MGMT_SYNW_SQLPOOL_URI: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_uri_sql.value }}
      MGMT_SYNW_SQLPOOL_NAME: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_sql_pool_name.value }}
      ARM_CLIENT_ID: ${{ inputs.arm_client_id }}
      ARM_CLIENT_SECRET: ${{ inputs.arm_client_secret }}
      RUN_ID: ${{ steps.register_deployment.outputs.RUN_ID }}
    run: |
      echo "Updating deployment status to COMPLETED for run_id $($env:RUN_ID)"

      $SQL_CONNECTION_STRING = "Server=tcp:$($env:MGMT_SYNW_SQLPOOL_URI),1433;Initial Catalog=$($env:MGMT_SYNW_SQLPOOL_NAME);Encrypt=True;Authentication=Active Directory Service Principal;User Id=$($env:ARM_CLIENT_ID); Password=$($env:ARM_CLIENT_SECRET)"

      Invoke-Sqlcmd `
        -ConnectionString $SQL_CONNECTION_STRING `
        -Query "DECLARE @now datetime = GETDATE(); UPDATE mgmt_xtinfra.infra_mgmt_version_config SET mgmt_deployment_status = 'COMPLETED', updated_at = @now WHERE run_id = '$($env:RUN_ID)'" `
        -OutputSqlErrors $true

      echo "Deployment status updated to COMPLETED for run_id $($env:RUN_ID)"

  - name: Update deployment status (failure)
    if: ${{ !success() && steps.register_deployment.outputs.RUN_ID != '' }}
    shell: pwsh
    env:
      MGMT_SYNW_SQLPOOL_URI: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_uri_sql.value }}
      MGMT_SYNW_SQLPOOL_NAME: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_sql_pool_name.value }}
      ARM_CLIENT_ID: ${{ inputs.arm_client_id }}
      ARM_CLIENT_SECRET: ${{ inputs.arm_client_secret }}
      RUN_ID: ${{ steps.register_deployment.outputs.RUN_ID }}
    run: |
      echo "Updating deployment status to FAILED for run_id $($env:RUN_ID)"

      $SQL_CONNECTION_STRING = "Server=tcp:$($env:MGMT_SYNW_SQLPOOL_URI),1433;Initial Catalog=$($env:MGMT_SYNW_SQLPOOL_NAME);Encrypt=True;Authentication=Active Directory Service Principal;User Id=$($env:ARM_CLIENT_ID); Password=$($env:ARM_CLIENT_SECRET)"

      Invoke-Sqlcmd `
        -ConnectionString $SQL_CONNECTION_STRING `
        -Query "DECLARE @now datetime = GETDATE(); UPDATE mgmt_xtinfra.infra_mgmt_version_config SET mgmt_deployment_status = 'FAILED', updated_at = @now WHERE run_id = '$($env:RUN_ID)'" `
        -OutputSqlErrors $true

      echo "Deployment status updated to FAILED for run_id $($env:RUN_ID)"
