name: 'Deploy Synapse Artifacts'
description: 'Deploy Synapse Artifacts from the database development repo'

inputs:
  target_environment:
    required: true
  terraform_outputs:
    required: true
  db_development_dir:
    required: true
  arm_client_id:
    required: true
  arm_client_secret:
    required: true
  arm_tenant_id:
    required: true

outputs:
  artifact_path:
    description: Artifact path for the test results
    value: ${{ steps.synapse_test.outputs.testResultsFile }}

runs:
  using: "composite"
  steps:
  - name: debug inputs
    if: true
    shell: bash
    env:
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      TF_OUTPUTS: ${{ inputs.terraform_outputs }}
      MGMT_DETAILS: ${{ fromJSON(inputs.terraform_outputs).mgmt_details.value }}
    run: |
      set -euo pipefail
      echo ${TARGET_ENVIRONMENT} | jq '.'
      echo ${TF_OUTPUTS} | jq '.'
      echo ${MGMT_DETAILS} | jq '.'

  - name: Prep environment
    id: prep_environment
    shell: bash
    env:
      TARGET_OE_NAME: ${{ fromJSON(inputs.target_environment).oe_name }}
      TARGET_INFRA_APP_NAME: ${{ fromJSON(inputs.target_environment).infra_app_name }}
      TARGET_STAGE: ${{ fromJSON(inputs.target_environment).stage }}

      ARM_SUBSCRIPTION_ID: ${{ fromJSON(inputs.target_environment).subscriptionId }}
      ARM_CLIENT_ID: ${{ inputs.arm_client_id }}
      ARM_CLIENT_SECRET: ${{ inputs.arm_client_secret }}
      ARM_TENANT_ID: ${{ inputs.arm_tenant_id }}

      TMP_WORKDIR: ${{ github.workspace }}/tmp
    run: |
      set -euo pipefail

      mkdir -p "${TMP_WORKDIR}"

      # Function to safely set environment variables with heredoc delimiters
      set_env_var() {
        local var_name="$1"
        local var_value="$2"
        local delimiter
        delimiter="$(openssl rand -hex 8)"
        {
          echo "${var_name}<<${delimiter}"
          echo "${var_value}"
          echo "${delimiter}"
        } >> $GITHUB_ENV
      }

      set_env_var "TMP_WORKDIR" "${TMP_WORKDIR}"
      set_env_var "ARM_SUBSCRIPTION_ID" "${ARM_SUBSCRIPTION_ID}"
      set_env_var "ARM_CLIENT_ID" "${ARM_CLIENT_ID}"
      set_env_var "ARM_CLIENT_SECRET" "${ARM_CLIENT_SECRET}"
      set_env_var "ARM_TENANT_ID" "${ARM_TENANT_ID}"
      set_env_var "TARGET_OE_NAME" "${TARGET_OE_NAME}"
      set_env_var "TARGET_INFRA_APP_NAME" "${TARGET_INFRA_APP_NAME}"
      set_env_var "TARGET_STAGE" "${TARGET_STAGE}"

  - name: Azure Login
    uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
    with:
      creds: '{"clientId":"${{ inputs.arm_client_id }}","clientSecret":"${{ inputs.arm_client_secret }}","subscriptionId":"${{ fromJSON(inputs.target_environment).subscriptionId }}","tenantId":"${{ inputs.arm_tenant_id }}"}'
      enable-AzPSSession: true

  - name: debug cmdlet
    if: true
    shell: pwsh
    run: |
      echo "debug cmdlet"
      Set-AzContext -SubscriptionId $env:ARM_SUBSCRIPTION_ID

  - name: Validate Artifacts
    uses: azure/synapse-workspace-deployment@b76db0833134872a789bea41667b47a7cf0494b7 # v1.9.1
    with:
      TargetWorkspaceName: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_name.value }}
      ArtifactsFolder: ${{ inputs.db_development_dir }}/code/synapse
      operation: "validate"
      deployManagedPrivateEndpoint: false
      DeleteArtifactsNotInTemplate: false

  - name: Prepare Deploy Parameters
    if: ${{ github.event.repository.name  != 'db-development' }}
    shell: bash
    working-directory: "${{ inputs.db_development_dir }}/code/synapseParameters"
    env:
      CORE_DETAILS: ${{ fromJSON(inputs.terraform_outputs).core_details.value }}
      MGMT_DETAILS: ${{ fromJSON(inputs.terraform_outputs).mgmt_details.value }}
      EXTENSION_DETAILS: ${{ fromJSON(inputs.terraform_outputs).extension_details.value }}
    run: |
      set -euo pipefail
      echo "prepare synapse parameters"
      flatten() {
        jq -c '
          . as $tree
          | [paths(scalars)]
          | map(
            . as $pp
            | {
                key: join("_"),
                value: ($tree | getpath($pp))
              }
            )
          | from_entries
        '
      }

      echo "{\"core\": ${CORE_DETAILS} }" | flatten > core_flat.json
      echo "{\"mgmt\": ${MGMT_DETAILS} }" | flatten > mgmt_flat.json
      echo "{\"extension\": ${EXTENSION_DETAILS} }" | flatten > extension_flat.json

      jq '
        . + {
          mgmt_storage_account_backup_name:
            (if (.mgmt_is_additional_backup_storage_enabled // false) == true
            then .mgmt_storage_account_backup_name
            else .mgmt_storage_account_curated_name
            end),
          mgmt_maintenance_function_name:
            (.mgmt_maintenance_synapse_maintenance_function_resource_id | split("/") | last)
        }
      ' mgmt_flat.json > mgmt_flat.resolved.json

      echo 'templatefile("params.synapse.json", merge(jsondecode(file("core_flat.json")), jsondecode(file("mgmt_flat.resolved.json")), jsondecode(file("extension_flat.json"))))' \
      | terraform console \
      | grep -v EOT \
      | jq '.' > deploy.params.synapse.json

      cat deploy.params.synapse.json

  - name: Run Pre-Processing
    id: synapse_preprocessing
    if: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && github.event.repository.name  != 'db-development'}}
    working-directory: "${{ inputs.db_development_dir }}/code/scripts"
    shell: pwsh
    env:
      MGMT_SYNW_NAME: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_name.value }}
    run: |
      ./SynapseRolloutPreprocessing.ps1 `
        -SubscriptionId "$env:ARM_SUBSCRIPTION_ID" `
        -SynapseWorkspaceName "$env:MGMT_SYNW_NAME" `
        -CheckPastDaysOfPipelineRuns 1

  - name: Deploy Artifacts
    if: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && github.event.repository.name  != 'db-development'}}
    uses: azure/synapse-workspace-deployment@b76db0833134872a789bea41667b47a7cf0494b7 # v1.9.1
    with:
      TargetWorkspaceName: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_name.value }}
      resourceGroup: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_resource_group_name.value }}
      TemplateFile: ${{ inputs.db_development_dir }}/synw-spf-0091-dev-mgmt/TemplateForWorkspace.json
      ParametersFile: ${{ inputs.db_development_dir }}/code/synapseParameters/deploy.params.synapse.json
      # ArtifactsFolder:
      operation: "deploy"
      deployManagedPrivateEndpoint: false
      # OverrideArmParameters:
      DeleteArtifactsNotInTemplate: false
      Environment: "Azure Public"
      tenantId: ${{ inputs.arm_tenant_id }}
      subscriptionId: ${{ env.ARM_SUBSCRIPTION_ID }}
      clientId: ${{ inputs.arm_client_id }}
      clientSecret: ${{ inputs.arm_client_secret }}
      managedIdentity: false

  - name: Run Post-Processing
    if: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && github.event.repository.name  != 'db-development'}}
    working-directory: "${{ inputs.db_development_dir }}/code/scripts"
    shell: pwsh
    env:
      MGMT_SYNW_NAME: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_name.value }}
    run: |
      ./SynapseRolloutPostprocessing.ps1 `
        -SubscriptionId "$env:ARM_SUBSCRIPTION_ID" `
        -SynapseWorkspaceName "$env:MGMT_SYNW_NAME"

  # TODO: use continue on error on previous step
  - name: Retry Post-Processing
    if: false
    # if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    working-directory: "${{ inputs.db_development_dir }}/code/scripts"
    shell: pwsh
    env:
      MGMT_SYNW_NAME: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_name.value }}
    run: |
      $maxRetryCount = 5
      for ($i = 1; $i -lt $maxRetryCount; $i++) {
        Write-Output "Trying to run the post-deployment script. Attempt $i"
        try {
            & "./SynapseRolloutPostprocessing.ps1" `
              -SubscriptionId "$env:ARM_SUBSCRIPTION_ID" `
              -SynapseWorkspaceName "$env:MGMT_SYNW_NAME" `
              -ErrorAction Stop
            break
        }
        catch {
            $_
        }
        Start-Sleep -Seconds 60
      }
      if ($i -eq $maxRetryCount) {
          Write-Error "Failed to run the post-deployment script."
      }
      else {
          Write-Output "Successfuly ran the post-deployment script."
      }

  - name: Run Post Processing Pipelines
    if: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && github.event.repository.name  != 'db-development'}}
    working-directory: "${{ inputs.db_development_dir }}/code/scripts"
    shell: pwsh
    env:
      MGMT_SYNW_NAME: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_name.value }}
    run: |
      $ErrorActionPreference = 'Stop'

      $PostProcessingPipelineNames = "pl_root_infra_pipe_process_order", "pl_root_infra_create_downtime_triggers"
      $PostProcessingPipelineNames | ForEach-Object -Parallel {
        . "./InvokeAndWaitForSynapsePipeline.ps1"
        InvokeAndWaitForSynapsePipeline -WorkspaceName $env:MGMT_SYNW_NAME -PipelineName $_ -TimeoutMinutes 30
      } -ThrottleLimit $PostProcessingPipelineNames.Count

  - name: Remove Old Resources
    if: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && github.event.repository.name  != 'db-development'}}
    working-directory: "${{ inputs.db_development_dir }}/code/scripts"
    shell: pwsh
    env:
      MGMT_SYNW_NAME: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_name.value }}
    run: |
      if(Test-Path -Path "./RemoveTriggersFromWorkspace.ps1") {
        & "./RemoveTriggersFromWorkspace.ps1" `
            -SynapseWorkspaceName "$env:MGMT_SYNW_NAME"
      }
      if(Test-Path -Path "./RemovePipelinesFromWorkspace.ps1") {
        & "./RemovePipelinesFromWorkspace.ps1" `
            -SynapseWorkspaceName "$env:MGMT_SYNW_NAME"
      }

  - name: Prepare SQL connection string
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.TARGET_OE_NAME == 'e2e' && env.TARGET_INFRA_APP_NAME == 'stamp-001' && env.TARGET_STAGE == 'dev' }}
    id: sql_connection_string
    shell: bash
    working-directory: ./
    run: |
      set -euo pipefail

      SQL_CONNECTION_STRING="Server=tcp:${MGMT_SYNW_SQLPOOL_URI},1433;Initial Catalog=${MGMT_SYNW_SQLPOOL_NAME};Encrypt=True;Authentication=Active Directory Service Principal;User Id=${ARM_CLIENT_ID}; Password=${ARM_CLIENT_SECRET}"

      echo "sql_connection_string=${SQL_CONNECTION_STRING}" >> "$GITHUB_OUTPUT"
    env:
      MGMT_SYNW_SQLPOOL_URI: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_uri_sql.value }}
      MGMT_SYNW_SQLPOOL_NAME: ${{ fromJSON(inputs.terraform_outputs).mgmt_synapse_workspace_sql_pool_name.value }}
      ARM_CLIENT_ID: ${{ inputs.arm_client_id }}
      ARM_CLIENT_SECRET: ${{ inputs.arm_client_secret }}

  - name: Execute Synapse Tests
    id: synapse_test
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.TARGET_OE_NAME == 'e2e' && env.TARGET_INFRA_APP_NAME == 'stamp-001' && env.TARGET_STAGE == 'dev' }}
    working-directory: "${{ inputs.db_development_dir }}/code/scripts"
    shell: pwsh
    env:
      SQL_CONNECTION_STRING: ${{ steps.sql_connection_string.outputs.sql_connection_string }}
    run: |
      Write-Host "Executing synapse artifacts test."
      Set-PSRepository PSGallery -InstallationPolicy Trusted
      Install-Module Pester -Force
      Import-Module Pester -PassThru
      Invoke-Pester -Output Detailed Synapse-Artifacts.Tests.ps1 *>&1 | Tee-Object -FilePath synapse_test_results.txt

      $notFailed = Select-String -Path "synapse_test_results.txt" -Pattern "Failed: 0"
      $notSkipped = Select-String -Path "synapse_test_results.txt" -Pattern "Skipped: 0"
      $notInconclusive = Select-String -Path "synapse_test_results.txt" -Pattern "Inconclusive: 0"
      $notNotRun = Select-String -Path "synapse_test_results.txt" -Pattern "NotRun: 0"

      if($notFailed -and $notSkipped -and $notInconclusive -and $notNotRun){
        $status = "pass"
      }
      else{
        $status = "fail"
      }

      $fileName = "test-result-" + (Get-Date).ToString("HH.mm.ss") + "-" + $status + ".txt"
      Rename-Item -Path "synapse_test_results.txt" -NewName $fileName

      Write-Output "testResultsFile=$fileName" >> $Env:GITHUB_OUTPUT

  # Upload test results as an artifact
  - name: Upload Test Results
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.synapse_test.result != 'skipped' && env.TARGET_OE_NAME == 'e2e' && env.TARGET_INFRA_APP_NAME == 'stamp-001' && env.TARGET_STAGE == 'dev'
    uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf # v3.2.2
    with:
      name: ${{ steps.synapse_test.outputs.testResultsFile }}
      path: ${{ inputs.db_development_dir }}/code/scripts/${{ steps.synapse_test.outputs.testResultsFile }}
