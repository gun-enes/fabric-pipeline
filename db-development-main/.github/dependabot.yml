version: 2
# enable-beta-ecosystems: true
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/workflows/actions/env-sensitive-db-test"
      - "/.github/workflows/actions/database"
      - "/.github/workflows/actions/mgmt-db-test"
      - "/.github/workflows/actions/synapse"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    labels:
      - "github-actions"
      - "dependencies"

    # Ignore not supported versions on GHES
    # Error: @actions/artifact v2.0.0+, upload-artifact@v4+ and download-artifact@v4+ are not currently supported on GHES.
    ignore:
      - dependency-name: "actions/artifact"
        versions: [">=2.0.0"]
      - dependency-name: "actions/upload-artifact"
        versions: [">=4.0.0"]
      - dependency-name: "actions/download-artifact"
        versions: [">=4.0.0"]
