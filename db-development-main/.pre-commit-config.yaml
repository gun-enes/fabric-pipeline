exclude: |
  (?x)^(
    synw-spf-0091-dev-mgmt/.*|
    synw-spf-0091-prp-mgmt/.*|
    code/synapse/.*
  )$
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
    - id: check-yaml
    - id: end-of-file-fixer
    - id: trailing-whitespace
    - id: check-json
    - id: check-yaml
    - id: pretty-format-json
      args: ["--indent", "2", "--autofix", "--no-sort-keys"]
