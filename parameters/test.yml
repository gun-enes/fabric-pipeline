# fabric-cicd main parameter file for the "test" environment.
# deploy/deploy.py passes this file to fabric-cicd; each file under `extend`
# is merged in. Paths are relative to this file; nested extend isn't allowed.
# One file per item; every replace_value is keyed by the env name ("test").

extend:
    - "./test/pl_demo.yml"
    - "./test/pl_process_tables.yml"
