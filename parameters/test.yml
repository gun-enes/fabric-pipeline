# fabric-cicd parameter file for the "test" environment.
# deploy/deploy.py copies this to ./parameter.yml before deploying.
# Every replace_value must be keyed by the environment name ("test").
# Keep the same entries in dev/test/prod; only the values should differ.

key_value_replace:
    # --- pl_demo pipeline parameters (one entry per value) ---------------
    - find_key: $.properties.parameters.greeting.defaultValue
      replace_value:
          test: "hello from test"
      item_type: "DataPipeline"
      item_name: "pl_demo"

    - find_key: $.properties.parameters.source_folder.defaultValue
      replace_value:
          test: "raw/test"
      item_type: "DataPipeline"
      item_name: "pl_demo"

    # Non-string values: leave unquoted so the JSON type is kept.
    - find_key: $.properties.parameters.batch_size.defaultValue
      replace_value:
          test: 500
      item_type: "DataPipeline"
      item_name: "pl_demo"

    - find_key: $.properties.parameters.is_debug.defaultValue
      replace_value:
          test: true
      item_type: "DataPipeline"
      item_name: "pl_demo"

    # Dynamic value: resolved at deploy time to the target workspace's ID.
    - find_key: $.properties.parameters.target_workspace_id.defaultValue
      replace_value:
          test: "$workspace.$id"
      item_type: "DataPipeline"
      item_name: "pl_demo"

    # --- Activity setting, located with a JSONPath filter -----------------
    - find_key: $.properties.activities[?(@.name=="Wait Before Run")].typeProperties.waitTimeInSeconds
      replace_value:
          test: 5
      item_type: "DataPipeline"
      item_name: "pl_demo"

    # --- pl_process_tables pipeline parameters ---------------------------
    # Lists become JSON arrays.
    - find_key: $.properties.parameters.tables.defaultValue
      replace_value:
          test:
              - "dbo.customers"
              - "dbo.orders"
      item_type: "DataPipeline"
      item_name: "pl_process_tables"

    - find_key: $.properties.parameters.load_type.defaultValue
      replace_value:
          test: "full"
      item_type: "DataPipeline"
      item_name: "pl_process_tables"

    - find_key: $.properties.parameters.wait_seconds_per_table.defaultValue
      replace_value:
          test: 2
      item_type: "DataPipeline"
      item_name: "pl_process_tables"

    - find_key: $.properties.parameters.fail_on_empty.defaultValue
      replace_value:
          test: true
      item_type: "DataPipeline"
      item_name: "pl_process_tables"

# Literal text that appears in many places (e.g. a dev lakehouse GUID) is
# easier to swap with find_replace than with one key_value_replace per spot:
#
# find_replace:
#     - find_value: "<dev-lakehouse-guid>"
#       replace_value:
#           test: "$items.Lakehouse.<lakehouse-name>.$id"
