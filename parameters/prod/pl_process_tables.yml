# pl_process_tables values for the "prod" environment (included by ../prod.yml).

key_value_replace:
    - find_key: $.properties.parameters.tables.defaultValue
      replace_value:
          prod:
              - "dbo.customers"
              - "dbo.orders"
              - "dbo.invoices"
      item_type: "DataPipeline"
      item_name: "pl_process_tables"

    - find_key: $.properties.parameters.load_type.defaultValue
      replace_value:
          prod: "incremental"
      item_type: "DataPipeline"
      item_name: "pl_process_tables"

    - find_key: $.properties.parameters.wait_seconds_per_table.defaultValue
      replace_value:
          prod: 5
      item_type: "DataPipeline"
      item_name: "pl_process_tables"

    - find_key: $.properties.parameters.fail_on_empty.defaultValue
      replace_value:
          prod: false
      item_type: "DataPipeline"
      item_name: "pl_process_tables"
