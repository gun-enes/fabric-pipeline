exclude: |
  (?x)^(
    README.md
  )$
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
    - id: end-of-file-fixer
    - id: trailing-whitespace
    - id: check-yaml
    - id: check-json
    - id: pretty-format-json
      args: ["--indent", "2", "--autofix", "--no-sort-keys"]
