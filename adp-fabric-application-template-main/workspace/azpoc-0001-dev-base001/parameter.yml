  - find_value: 44397381-b694-4db9-af35-23f34b59e78e   # azpoc-0001-dev-base001eng001
    replace_value:
      tst: e346b4e5-8adc-4d01-9abe-2461dd1f28f2 # azpoc-0001-tst-base001eng001
      # prd: <replace-with-this-value>

  # Workspace Names
  - find_value: azpoc-0001-dev-base001
    replace_value:
      tst: azpoc-0001-tst-base001
      # prd: <replace-with-this-value>

  - find_value: azpoc-0001-dev-base001eng001
    replace_value:
      tst: azpoc-0001-tst-base001eng001
      # prd: <replace-with-this-value>

  # Lakehouse IDs for Shortcut and Default Data Access Roles Translation
  - find_value: a438fb0f-11cd-41d4-acfb-f59acfb53cbf   # lh_azpoc_0001_dev_base001_001
    replace_value:
      tst: 47e21c5a-2779-45b0-b64a-96d1daef0570 # lh_azpoc_0001_tst_base001_001
