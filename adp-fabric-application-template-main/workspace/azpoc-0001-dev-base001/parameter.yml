      # prd: <replace-with-this-value>

  # Lakehouse Names // CICD Script will assume LH to be names the same in both stages, so we need to rename
  - find_value: lh_azpoc_0001_dev_base001_001
    replace_value:
      tst: lh_azpoc_0001_tst_base001_001
      # prd: <replace-with-this-value>
  - find_value: lh_azpoc_0001_dev_base001eng001_001        # lakehouse display name
    replace_value:
      tst: lh_azpoc_0001_tst_base001eng001_001
      # prd: <replace-with-this-value>

  
  # Notebook IDs (from same workspace) in pipelines: logical ids from dev are looked up in the repo (.platform file), translated to the name and then the id in tst is looked up

  # Data Access Roles: WorkspaceId/ItemId
  # base001
  - find_value: 00000000-0000-0000-0000-000000000000/00000000-0000-0000-0000-000000000000   # sourcePath placeholder in data-access-roles.json
    replace_value:
      tst: 73ded50c-9280-47ab-bc1f-a2bfbbc25e0c/47e21c5a-2779-45b0-b64a-96d1daef0570
      # prd: <replace-with-this-value>

  # Connections
  - find_value: 2f86c684-d313-4d90-a1eb-7f3cbba5f5cb # cc-azpoc-dev-notebook
    replace_value:
      tst: 3a8dd13d-ab1e-48eb-b94b-1f7c88782c74 # cc-azpoc-tst-notebook
      # prd: <replace-with-this-value>