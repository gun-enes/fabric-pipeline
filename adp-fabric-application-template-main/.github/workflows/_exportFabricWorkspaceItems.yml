name: Export-Fabric-Workspace-Items

on:
  workflow_dispatch:
    inputs:
      customer:
        description: "Customer name, e.g. ids, azuk"
        required: true
        default: "azpoc"
      environment:
        description: "Customer environment code (e.g. 0001, 0002)"
        required: true
        default: "0001"
      stage:
        description: "Stage (GitHub environment: dev, tst, prd). The stage where last code state is developed. Currently only dev is supported together with publish workflow."
        required: true
        default: "dev"
      workspace_suffix:
        description: "Workspace suffixes (comma-separated, e.g. base001,base001eng001)"
        required: true
        default: base001, base001eng001
      branch:
        description: "Branch to checkout and push to"
        required: true
        default: "main"

jobs:
  export:
    permissions:
      contents: write
    runs-on: [self-hosted, linux, adp, primary]
    name: Export Fabric Workspace Items

    # stage is the GitHub environment
    environment: ${{ inputs.stage }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests azure-identity pyyaml

      # Step 1: Build workspace names
      - name: Build workspace names
        id: build_workspaces
        env:
          INPUT_WORKSPACE_SUFFIX: ${{ inputs.workspace_suffix }}
          INPUT_CUSTOMER: ${{ inputs.customer }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_STAGE: ${{ inputs.stage }}
        run: |
          IFS=',' read -ra SUFFIXES <<< "$INPUT_WORKSPACE_SUFFIX"
          WORKSPACES=()

          for suffix in "${SUFFIXES[@]}"; do
            suffix=$(echo "$suffix" | xargs)
            ws="${INPUT_CUSTOMER}-${INPUT_ENVIRONMENT}-${INPUT_STAGE}-${suffix}"
            WORKSPACES+=("$ws")
          done

          WORKSPACE_LIST=$(IFS=','; echo "${WORKSPACES[*]}")
          echo "workspace_list=$WORKSPACE_LIST" >> $GITHUB_OUTPUT

          echo "Resolved workspaces:"
          for ws in "${WORKSPACES[@]}"; do
            echo " - $ws"
          done

      # Step 2: Export with suffix-based credentials
      - name: Export workspace items
        env:
          INPUT_WORKSPACE_SUFFIX: ${{ inputs.workspace_suffix }}
          INPUT_TENANT_ID: ${{ secrets.TENANT_ID }}
          BUILD_WORKSPACE_LIST: ${{ steps.build_workspaces.outputs.workspace_list }}
          # Must be explicitly mapped (GitHub limitation)
          base001_CLIENT_ID: ${{ secrets.base001_CLIENT_ID }}
          base001_CLIENT_SECRET: ${{ secrets.base001_CLIENT_SECRET }}
          base001eng001_CLIENT_ID: ${{ secrets.base001eng001_CLIENT_ID }}
          base001eng001_CLIENT_SECRET: ${{ secrets.base001eng001_CLIENT_SECRET }}
        run: |
          IFS=',' read -ra SUFFIXES <<< "$INPUT_WORKSPACE_SUFFIX"
          IFS=',' read -ra WORKSPACES <<< "$BUILD_WORKSPACE_LIST"

          for i in "${!WORKSPACES[@]}"; do
            echo "=== Exporting workspace: $ws ==="
            suffix=$(echo "${SUFFIXES[$i]}" | xargs)
            ws=$(echo "${WORKSPACES[$i]}" | xargs)

            CLIENT_ID_VAR="${suffix}_CLIENT_ID"
            CLIENT_SECRET_VAR="${suffix}_CLIENT_SECRET"

            CLIENT_ID=$(printenv "$CLIENT_ID_VAR")
            CLIENT_SECRET=$(printenv "$CLIENT_SECRET_VAR")

            python .github/workflows/scripts/export_all_workspace_items.py \
              --tenant-id "$INPUT_TENANT_ID" \
              --client-id "$CLIENT_ID" \
              --client-secret "$CLIENT_SECRET" \
              --auth-mode service_principal \
              --workspace-name "$ws" \
              --output-dir "workspace/$ws"


            python .github/workflows/scripts/export_data_access_roles.py \
              --tenant-id "$INPUT_TENANT_ID" \
              --client-id "$CLIENT_ID" \
              --client-secret "$CLIENT_SECRET" \
              --workspace-name "$ws" \
              --output-dir "oneLakeSecurity/workspace/$ws"

          done

      - name: Commit and push exported items
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          BUILD_WORKSPACE_LIST: ${{ steps.build_workspaces.outputs.workspace_list }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "workspace"
          git add "oneLakeSecurity"
          git commit -m "workspace export ${BUILD_WORKSPACE_LIST}" || echo "No changes to commit"
          git push origin "$INPUT_BRANCH"